<nav class="nav">
  <a class="brand" routerLink="/">🛰️ Satélites</a>
  <a routerLink="/globe" routerLinkActive="active">Globo</a>
  @if (auth.isLoggedIn()) {
    <button class="link" (click)="win.openProfile()">Perfil</button>
    <button class="link" (click)="win.openStats()">Stats</button>
    <button class="link" (click)="auth.logout()">Salir</button>
  } @else {
    <a routerLink="/login" routerLinkActive="active">Entrar</a>
  }
</nav>
<router-outlet />

@if (auth.isLoggedIn() && win.profileOpen()) {
  <app-window title="Perfil" [initialX]="120" [initialY]="80" (close)="win.profileOpen.set(false)">
    @defer (on immediate) {
      <app-profile />
    } @placeholder {
      <p class="win-loading">Cargando…</p>
    }
  </app-window>
}

@if (auth.isLoggedIn() && win.statsOpen()) {
  <app-window title="Estadísticas" [initialX]="220" [initialY]="130" (close)="win.statsOpen.set(false)">
    @defer (on immediate) {
      <app-stats />
    } @placeholder {
      <p class="win-loading">Cargando…</p>
    }
  </app-window>
}
